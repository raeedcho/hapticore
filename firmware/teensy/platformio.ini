; PlatformIO project for the Hapticore Teensy 4.1 sync hub firmware.
; See firmware/teensy/README.md for build and flash instructions.

[platformio]
default_envs = teensy41

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -std=gnu++17
build_src_flags =
    -Wall
    -Wextra
    -Werror
upload_protocol = teensy-cli
monitor_speed = 115200

[env:native]
; Host-side tests of the hardware-free logic (parser, reward policy). CI runs
; these as a required gate (`pio test -e native`). Add each new hardware-free
; source file to build_src_filter.
platform = native
build_flags =
    -std=gnu++17
build_src_flags =
    -Wall
    -Wextra
build_src_filter =
    +<parser.cpp>
    +<reward.cpp>
test_build_src = yes
test_framework = unity
