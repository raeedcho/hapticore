name: Claude Code Review

# Reviews a PR once, when it becomes ready for review, as inline comments:
#   - a draft (including Claude's) is reviewed when someone marks it ready;
#   - a PR opened as non-draft is ready from the start, so it's reviewed on open.
# Read-only: no tests, since CI runs those. To ask for another review after big
# changes, comment "@claude review this PR" (handled by claude.yml).
#
# Don't make this a required status check: the paths-ignore filter would leave
# docs-only PRs waiting on it forever.

on:
  pull_request:
    types: [opened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, and skip events a bot triggered, which the action would reject.
    # This checks who triggered the event, not who wrote the PR, so Claude's PRs
    # are still reviewed when you mark them ready.
    if: github.event.pull_request.draft == false && !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write   # required for the action's default GitHub App authentication

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # The inline-comment tool must be named here, or the action doesn't
          # start the MCP server that posts review comments.
          claude_args: >-
            --model sonnet
            --advisor opus
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
