# Center-out reaching task configuration, scaled for the Novint Falcon's
# smaller ~10 cm workspace (see configs/rig/desktop-falcon.yaml).
#
# center_out.yaml's target_distance of 0.08 m is outside the Falcon's ~5 cm
# reach from center, so this variant uses target_distance: 0.03 (radius
# 0.03 m, well within the ~±5 cm workspace) and a proportionally smaller
# target_radius. Geometry is provisional and should be tuned on hardware.

experiment_name: "center_out_reaching"

task:
  task_class: "hapticore.tasks.center_out.CenterOutTask"
  params:
    num_targets: 8
    target_distance: 0.03
    target_radius: 0.006
    hold_time: 0.5
    reach_timeout: 2.0
    iti_duration: 1.0
  conditions:
    - target_id: 0
      target_position: [0.03, 0.0]
    - target_id: 1
      target_position: [0.0212, 0.0212]
    - target_id: 2
      target_position: [0.0, 0.03]
    - target_id: 3
      target_position: [-0.0212, 0.0212]
    - target_id: 4
      target_position: [-0.03, 0.0]
    - target_id: 5
      target_position: [-0.0212, -0.0212]
    - target_id: 6
      target_position: [0.0, -0.03]
    - target_id: 7
      target_position: [0.0212, -0.0212]
  block_size: 8
  num_blocks: 20
  randomization: "pseudorandom"

audio:
  cues:
    go_cue: "assets/audio/go_cue.wav"
    click: "assets/audio/Monkey_Click.wav"
